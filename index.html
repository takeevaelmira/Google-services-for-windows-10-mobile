<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Services</title>
    <style>
        body {
            background-color: #121212;
            color: #e8eaed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            margin-bottom: 30px;
        }
        .site-title {
            font-size: 32px;
            font-weight: 700;
            color: #8ab4f8;
            margin: 0 0 8px 0;
        }
        .site-subtitle {
            font-size: 16px;
            color: #9aa0a6;
            margin: 0;
        }
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }
        .os-card {
            display: block;
            background-color: #202124;
            border: 1px solid #3c4043;
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.2s, transform 0.2s;
        }
        .os-card:active {
            background-color: #2d2e31;
            transform: scale(0.98);
        }
        .os-card-title {
            font-size: 20px;
            font-weight: 600;
            color: #e8eaed;
            margin-bottom: 6px;
        }
        .os-card-desc {
            font-size: 14px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="site-title">Google Services</h1>
        <p class="site-subtitle">Select</p>
    </div>

    <div class="cards-container">
        <a href="./windows10mobile/" class="os-card">
            <div class="os-card-title">Windows 10 Mobile</div>
            <div class="os-card-desc">Google apps and services adapted for W10M</div>
        </a>
    </div>

</body>
</html>
